<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EFE5D4" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable, La Ponte Vecchio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --ocra: #efe5d4;
        --sauce: #b3311e;
        --ink: #1e1b18;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--ocra);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        display: grid;
        gap: 1.25rem;
        justify-items: start;
        max-width: 34rem;
      }
      svg {
        width: min(100%, 280px);
      }
      h1 {
        font-size: clamp(2.25rem, 9vw, 3.5rem);
        line-height: 1;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.55;
      }
      .ctas {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0.8rem 1.35rem;
        border: 2px solid var(--ink);
        border-radius: 999px;
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
        touch-action: manipulation;
        transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      a:active {
        transform: scale(0.97);
      }
      a.primary {
        background: var(--sauce);
        border-color: var(--sauce);
        color: #fff;
      }
      a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 280 70" aria-hidden="true">
        <path d="M8 60 Q140 -10 272 60" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" />
        <path d="M8 64 q17 -8 34 0 t34 0 t34 0" fill="none" stroke="#b3311e" stroke-width="3" stroke-linecap="round" />
      </svg>
      <h1>Ce pont ne mène nulle part.</h1>
      <p>La page demandée n’existe pas ou a changé d’adresse. La carte, elle, est toujours là.</p>
      <div class="ctas">
        <a class="primary" href="%BASE_URL%#carte">Voir la carte</a>
        <a href="%BASE_URL%">Retour à l’accueil</a>
        <a href="tel:+33299834252">02 99 83 42 52</a>
      </div>
    </main>
  </body>
</html>
